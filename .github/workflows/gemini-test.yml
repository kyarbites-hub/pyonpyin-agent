name: PyonPyin Tests and Optional Gemini Smoke Test

on:
  workflow_dispatch:
    inputs:
      run_live_api_test:
        description: "Make one live Gemini API request (may use quota or incur charges)"
        required: true
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run offline workflow and safety tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run optional live Gemini smoke test
        if: github.event_name == 'workflow_dispatch' && inputs.run_live_api_test
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/gemini_smoke_test.py
